services:
  app:
    container_name: shay-zilberman-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app  # Mount source code for hot reload
      - ./alembic:/app/alembic  # Mount alembic directory
    environment:
      - PYTHONPATH=/app/app
      - PYTHONUNBUFFERED=1
      - HOME_ASSIGNMENT_ENV=development
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    container_name: shay-zilberman-db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dbuser -d homeassignment"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: