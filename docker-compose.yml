services:
  app:
    container_name: shay-zilberman-app
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app  # Mount source code for hot reload
    environment:
      - PYTHONPATH=/app/app
      - PYTHONUNBUFFERED=1
    command: poetry run -m uvicorn main:app --host 0.0.0.0 --port 8000 --reload
