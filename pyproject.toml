[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "shay-zilberman-home-assignment"
version = "0.1.0"
description = "Shay Zilberman's Home Assignment"
authors = ["Shay Zilberman <zilberman.shay@gmail.com>"]
maintainers = ["Shay Zilberman <zilberman.shay@gmail.com>"]
package-mode = false


[tool.poetry.dependencies]
python = "^3.11"

fastapi = "^0.116.1"
uvicorn = "^0.35.0"
dynaconf = "^3.2.4"
pydantic = ">=2.0.0"


[tool.poetry.group.dev.dependencies]
autoflake = "^2.3.1"
black = "^25.1.0"
isort = { version = "^6.0.1", extras = ["pyproject"]}
requests = "^2.32.4"
pytest = "^8.4.1"

[tool.black]
line-length = 115
target_version = ['py311']
exclude = '''
(
  /(
    \.git
    | \.mypy_cache
    | \.pytest_cache
    | htmlcov
    | venv
    | .venv
  )/
)
'''

[tool.isort]
line_length = 115
indent = '    '
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
lines_after_imports = 2
lines_between_sections = 1
force_sort_within_sections = true
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]
src_paths = ["app"]
